# verify_board.cfg
# Script de OpenOCD para "Hardware Fingerprinting"
# Ejecuta pruebas en el silicio para determinar capacidades reales.

init
reset halt

echo " "
echo "=========================================================="
echo "   APM32/STM32 HARDWARE FINGERPRINTING Y STRESS TEST      "
echo "=========================================================="

echo " "
echo "--- Lectura de Identificador de Silicio (DBGMCU_IDCODE) ---"
echo "Direccion: 0xE0042000"
echo "  * Original STM32F103 / APM32F103 = 0xXX000410"
mdw 0xE0042000

echo " "
echo "--- Lectura de Capacidad de Flash de Fabrica ---"
echo "Direccion: 0x1FFFF7E0"
echo "  * Muestra los KB configurados en la mascara de fabrica (Ej. 0x0080 = 128KB, 0x0040 = 64KB)"
mdw 0x1FFFF7E0

echo " "
echo "--- Stress Test de SRAM (Limite de 20KB) ---"
echo "Direccion de prueba: 0x20004FFC (Ultima palabra entera de 20KB)"
echo "Escribiendo '0xDEADBEEF'..."
mww 0x20004FFC 0xDEADBEEF
echo "Leyendo de vuelta (Deberia ser DEADBEEF si la memoria es estable):"
mdw 0x20004FFC

echo " "
echo "--- Stress Test de SRAM (Limite extendido a 32KB) ---"
echo "Direccion de prueba: 0x20007FFC"
echo "  * Algunos chips CBT6 tienen 32KB ocultos o habilitados."
echo "  * Si falla o da error de acceso (Data Abort / Bus Fault), es de 20KB."
echo "Escribiendo '0xCAFEBABE'..."
mww 0x20007FFC 0xCAFEBABE
echo "Leyendo de vuelta:"
mdw 0x20007FFC

echo " "
echo "--- Prueba de Aliasing (Espejado de Memoria) ---"
echo "  * Escribimos en la base de la RAM (0x20000000) y leemos saltando 20KB (0x20005000)."
echo "  * Si vemos el mismo valor reflejado, la RAM fisica es diminuta y solo esta repetida."
mww 0x20000000 0x11223344
echo "Leer 0x20005000 (NOTA: Si lee 11223344, hay aliasing):"
mdw 0x20005000

echo " "
echo "=========================================================="
echo "   VERIFICACION COMPLETADA. Revisa los resultados arriba. "
echo "=========================================================="

shutdown
